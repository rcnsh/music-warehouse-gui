[package]
name = "music-warehouse-gui"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "mwgui"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders"] }
gpui-component = "=0.7.1"
# Must match gpui-pre; it backs img() downloads.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.8" }
gpui-base = "=0.7.1"
gpui-kit-assets = "=0.7.1"
chrono = "0.4.45"
dirs = "7"
iana-time-zone = "0.1.65"
keyring = "4.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
# Renders the window to PNG on request for screenshots without a Screen
# Recording grant. Development only; see src/dev_capture.rs.
dev-capture = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]
