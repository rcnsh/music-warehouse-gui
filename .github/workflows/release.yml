name: release

# Pushing a tag like v0.2.0 builds the app and publishes a GitHub release.
# Running the workflow by hand builds the same zip as a downloadable artifact
# without publishing anything, to try a release before tagging it.
#
# The checks and each architecture's build run on their own runners at the
# same time, since a release build takes most of a runner's cores; the
# package job then joins the two binaries into one app.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Also written into the app's Info.plist by the bundle script.
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  check:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Pinned by commit, the action cannot read the toolchain from its ref.
          toolchain: stable
          components: rustfmt, clippy

      - name: Read version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "music-warehouse-gui") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A release whose files say a different version than its tag is
      # confusing to undo, so refuse it here.
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "v${{ steps.version.outputs.version }}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check script
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked

  build:
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Pinned by commit, the action cannot read the toolchain from its ref.
          toolchain: stable
          targets: ${{ matrix.target }}

      # One cache per target: both legs share the job id, so without the
      # target in the key they would overwrite each other's cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/mwgui
          if-no-files-found: error
          retention-days: 1

  package:
    needs: [check, build]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*

      # One universal binary, so a single download runs on Apple Silicon and
      # Intel Macs.
      - name: Universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/mwgui \
            bin-aarch64-apple-darwin/mwgui \
            bin-x86_64-apple-darwin/mwgui
          # Artifacts don't keep the executable bit.
          chmod +x dist/mwgui
          lipo -info dist/mwgui

      # The Developer ID certificate goes into a throwaway keychain for this
      # job. Without the secrets (a fork, say) the app is signed ad hoc.
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "::warning::No MACOS_CERTIFICATE_P12 secret; the app will be signed ad hoc and not notarized"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE_P12"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Bundle app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/bundle-macos.sh dist/mwgui "$VERSION" dist

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: music-warehouse-gui-${{ env.VERSION }}-macos
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 \
            --title "Music Warehouse $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            --verify-tag
